name: Pub Combat Gameplay Validation
on:
  pull_request:
    paths:
      - 'src/lib/combat.ts'
      - 'src/lib/actions.ts'
      - 'src/lib/game-state.ts'
      - 'src/components/PubBrawl.tsx'
      - 'src/components/CharacterDashboards.tsx'
      - 'src/lib/rooms.ts'
      - 'src/routes/index.tsx'
      - 'src/test/pub-brawl.test.ts'
      - '.github/workflows/pub-combat-gameplay.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/pub-brawl.test.ts
      - run: bun run build

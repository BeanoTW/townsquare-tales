name: Phase A crew verification
on:
  pull_request:
    paths:
      - 'src/lib/street-gang.ts'
      - 'src/components/TownMap.tsx'
      - 'src/components/town3d/actors.tsx'
      - 'src/routes/index.tsx'
      - 'src/test/crew-spots.test.ts'
      - '.github/workflows/phase-a-crew.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/crew-spots.test.ts src/test/crew-characters.test.ts src/test/gang-physical-tasks.test.ts
      - run: bunx tsc --noEmit
        continue-on-error: true
      - run: bun run build

name: Vehicle Food Sleep Verification
on:
  pull_request:
    paths:
      - 'src/lib/actions.ts'
      - 'src/lib/game-state.ts'
      - 'src/lib/shop-catalog.ts'
      - 'src/lib/town-mail.ts'
      - 'src/components/TownMap.tsx'
      - 'src/components/CharacterDashboards.tsx'
      - 'src/routes/index.tsx'
      - 'src/test/vehicle-food-sleep.test.ts'
      - '.github/workflows/vehicle-food-sleep.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/vehicle-food-sleep.test.ts src/test/sleep-streak.test.ts
      - run: bun run build

name: Courier minimap verification
on:
  pull_request:
    paths:
      - 'src/components/TownMap.tsx'
      - '.github/workflows/courier-waypoint.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/gang-courier.test.ts
      - run: bun run build

name: Gang encounter depth verification
on:
  pull_request:
    paths:
      - 'src/lib/gang-career.ts'
      - 'src/routes/index.tsx'
      - 'src/test/gang-encounters.test.ts'
      - '.github/workflows/gang-encounters.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/gang-encounters.test.ts src/test/gang-physical-tasks.test.ts src/test/gang-courier.test.ts
      - run: bunx tsc --noEmit
        continue-on-error: true
      - run: bun run build

name: Robbery discovery verification
on:
  pull_request:
    paths:
      - 'src/lib/counter-robbery.ts'
      - 'src/routes/index.tsx'
      - 'src/components/rooms/CounterRobberyChoice.tsx'
      - 'src/test/robbery-discovery.test.ts'
      - '.github/workflows/robbery-discovery.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/robbery-discovery.test.ts
      - run: bun run build
